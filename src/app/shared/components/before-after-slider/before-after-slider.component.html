<div
  class="relative w-full overflow-hidden select-none group rounded-xs border border-og-border shadow-elevated bg-slate-100"
  [class]="aspectRatio()"
>
  <!-- Imagen 'DESPUÉS' (Fondo Completo) -->
  <img
    [src]="afterImage()"
    [alt]="alt() + ' - Resultado Final'"
    loading="lazy"
    class="absolute inset-0 w-full h-full object-cover pointer-events-none"
  />
  <div class="absolute top-4 right-4 z-10">
    <span class="px-2.5 py-1 text-[10px] tracking-[0.2em] uppercase font-semibold bg-slate-900/80 text-white backdrop-blur-md rounded-xs border border-white/10">
      {{ afterLabel() }}
    </span>
  </div>

  <!-- Imagen 'ANTES' (Capa recortada con clip-path dinámico) -->
  <div
    class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none"
    [style.clip-path]="'inset(0 ' + (100 - sliderPosition()) + '% 0 0)'"
  >
    <img
      [src]="beforeImage()"
      [alt]="alt() + ' - Estado Inicial'"
      loading="lazy"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <div class="absolute top-4 left-4 z-10">
      <span class="px-2.5 py-1 text-[10px] tracking-[0.2em] uppercase font-semibold bg-og-headline/80 text-white backdrop-blur-md rounded-xs border border-white/10">
        {{ beforeLabel() }}
      </span>
    </div>
  </div>

  <!-- Línea Divisoria y Controlador Central -->
  <div
    class="absolute top-0 bottom-0 w-0.5 bg-white shadow-[0_0_10px_rgba(0,0,0,0.5)] z-20 pointer-events-none"
    [style.left.%]="sliderPosition()"
  >
    <!-- Pomo de Arrastre con Ícono de Flechas -->
    <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white text-slate-900 shadow-xl flex items-center justify-center border-2 border-og-electric transition-transform duration-150 group-hover:scale-110">
      <svg class="w-4 h-4 text-og-electric" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="m9 18-6-6 6-6" />
        <path d="m15 6 6 6-6 6" />
      </svg>
    </div>
  </div>

  <!-- Control de Rango Oculto pero Totalmente Accesible para Arrastre con Mouse o Touch -->
  <input
    type="range"
    min="0"
    max="100"
    [value]="sliderPosition()"
    (input)="onRangeInput($event)"
    class="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize z-30 m-0 p-0"
    [attr.aria-label]="'Comparar antes y después de ' + alt()"
  />
</div>
