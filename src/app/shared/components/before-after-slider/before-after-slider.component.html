<div
  class="relative w-full overflow-hidden select-none group rounded-[22px] border border-slate-200/90 shadow-elevated bg-slate-100 transition-all duration-300 hover:shadow-[0_25px_50px_-12px_rgba(0,114,206,0.2)]"
  [class]="aspectRatio()"
>
  <!-- Imagen 'DESPUÉS' (Fondo Completo) -->
  <img
    [src]="afterImage()"
    [alt]="alt() + ' - Resultado Final'"
    loading="lazy"
    class="absolute inset-0 w-full h-full object-cover pointer-events-none transition-transform duration-700 ease-out group-hover:scale-[1.02]"
  />
  
  <!-- Badge Flotante 'DESPUÉS' con Efecto Esmerilado -->
  <div class="absolute top-4 right-4 z-10 pointer-events-none">
    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 text-[11px] tracking-[0.2em] uppercase font-mono font-bold bg-slate-950/80 text-white backdrop-blur-md rounded-full border border-white/20 shadow-md">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      {{ afterLabel() }}
    </span>
  </div>

  <!-- Imagen 'ANTES' (Capa recortada con clip-path dinámico) -->
  <div
    class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none"
    [style.clip-path]="'inset(0 ' + (100 - sliderPosition()) + '% 0 0)'"
  >
    <img
      [src]="beforeImage()"
      [alt]="alt() + ' - Estado Inicial'"
      loading="lazy"
      class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.02]"
    />
    
    <!-- Badge Flotante 'ANTES' con Efecto Esmerilado -->
    <div class="absolute top-4 left-4 z-10 pointer-events-none">
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 text-[11px] tracking-[0.2em] uppercase font-mono font-bold bg-slate-900/80 text-white backdrop-blur-md rounded-full border border-white/20 shadow-md">
        <span class="w-1.5 h-1.5 rounded-full bg-og-cyan"></span>
        {{ beforeLabel() }}
      </span>
    </div>
  </div>

  <!-- Línea Divisoria y Controlador Central con Resplandor Neón -->
  <div
    class="absolute top-0 bottom-0 w-[2px] bg-white shadow-[0_0_15px_rgba(41,182,246,0.9),0_0_5px_rgba(255,255,255,0.9)] z-20 pointer-events-none transition-opacity duration-200"
    [style.left.%]="sliderPosition()"
  >
    <!-- Pomo de Arrastre Magnético con Anillo Neón y Flechas Táctiles -->
    <div
      class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-11 h-11 rounded-full bg-white text-slate-900 shadow-[0_4px_25px_rgba(0,0,0,0.35)] flex items-center justify-center border-2 border-og-electric transition-all duration-200"
      [class.scale-125]="isDragging()"
      [class.ring-4]="isDragging()"
      [class.ring-og-cyan/40]="isDragging()"
      [class.group-hover:scale-110]="!isDragging()"
    >
      <div class="flex items-center justify-center gap-0.5 text-og-electric">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="m14 18-6-6 6-6" />
        </svg>
        <div class="w-[2px] h-3.5 bg-slate-300 rounded-full"></div>
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="m10 6 6 6-6 6" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Control de Rango Oculto pero Totalmente Accesible para Arrastre con Mouse o Touch -->
  <input
    type="range"
    min="0"
    max="100"
    [value]="sliderPosition()"
    (input)="onRangeInput($event)"
    (mousedown)="onPointerDown()"
    (mouseup)="onPointerUp()"
    (touchstart)="onPointerDown()"
    (touchend)="onPointerUp()"
    class="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize z-30 m-0 p-0"
    [attr.aria-label]="'Comparar antes y después de ' + alt()"
  />
</div>
