# nginx del contenedor `odontogamma` (se monta en /etc/nginx/conf.d/default.conf).
# El deploy lo copia junto al build; ver .github/workflows/deploy.yml.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Cloudflare el contenedor ve http: sin esto las redirecciones apuntarían a http://
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Rutas anteriores en inglés -> rutas actuales
    location = /who-we-are                 { return 301 /quienes-somos/sobre-nosotros; }
    location = /who-we-are/about-us        { return 301 /quienes-somos/sobre-nosotros; }
    location = /who-we-are/dr-jaime-arcila { return 301 /quienes-somos/dr-jaime-arcila; }
    location = /who-we-are/our-team        { return 301 /quienes-somos/equipo; }
    location = /who-we-are/our-location    { return 301 /quienes-somos/sede; }

    # Rutas que cambiaron al reorganizar el sitio (el sitemap ya no las lista)
    location = /sobre-mi                   { return 301 /quienes-somos/dr-jaime-arcila; }
    location = /transformaciones           { return 301 /nuestro-trabajo/antes-y-despues; }
    location = /testimonios                { return 301 /nuestro-trabajo/testimonios; }
    location = /valoracion-virtual         { return 301 /nuestro-trabajo/valoracion-virtual; }
    location = /quienes-somos              { return 301 /quienes-somos/sobre-nosotros; }
    location = /nuestro-trabajo            { return 301 /nuestro-trabajo/antes-y-despues; }

    # JS y CSS llevan hash en el nombre: se pueden cachear un año
    location ~* \.(js|css|woff2?|png|jpg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cada ruta tiene su index.html prerenderizado
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Rutas inexistentes: estado 404 real; Angular dibuja la página 404 (con noindex)
    error_page 404 /index.csr.html;
}
