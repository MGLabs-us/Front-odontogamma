# nginx del contenedor `odontogamma` (se monta en /etc/nginx/conf.d/default.conf).
# El deploy lo copia junto al build; ver .github/workflows/deploy.yml.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Cloudflare el contenedor ve http: sin esto las redirecciones apuntarían a http://
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # El sitio ahora es multilenguaje: inglés (EE. UU.) en la raíz, /en-gb y /es.
    # Las URLs en español que ya estaban indexadas pasan a /es (301) conservando el resto de la ruta.
    location ~ ^/(servicios|quienes-somos|nuestro-trabajo|contacto)(/.*)?$ { return 301 /es$request_uri; }

    # Rutas anteriores a la reorganización del sitio
    location = /sobre-mi                   { return 301 /es/quienes-somos/dr-jaime-arcila; }
    location = /transformaciones           { return 301 /es/nuestro-trabajo/antes-y-despues; }
    location = /testimonios                { return 301 /es/nuestro-trabajo/testimonios; }
    location = /valoracion-virtual         { return 301 /es/nuestro-trabajo/valoracion-virtual; }

    # Secciones sin página propia: llevan a su primera página, en cada idioma
    location = /who-we-are                 { return 301 /who-we-are/about-us; }
    location = /our-work                   { return 301 /our-work/before-and-after; }
    location = /en-gb/who-we-are           { return 301 /en-gb/who-we-are/about-us; }
    location = /en-gb/our-work             { return 301 /en-gb/our-work/before-and-after; }
    location = /es/quienes-somos           { return 301 /es/quienes-somos/sobre-nosotros; }
    location = /es/nuestro-trabajo         { return 301 /es/nuestro-trabajo/antes-y-despues; }

    # JS y CSS llevan hash en el nombre: se pueden cachear un año
    location ~* \.(js|css|woff2?|png|jpg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cada ruta tiene su index.html prerenderizado
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Rutas inexistentes: estado 404 real; Angular dibuja la página 404 (con noindex)
    error_page 404 /index.csr.html;
}
