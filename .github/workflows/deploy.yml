name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload build to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${VPS_PORT:-22}" \
            dist/odontoGammaOriente/browser/ \
            "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      # El nginx del contenedor vive en el repo (deploy/odontogamma-nginx.conf). Se copia junto a
      # la carpeta del build, que es donde docker-compose lo monta, y se recrea el contenedor.
      - name: Update container nginx config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          APP_DIR="$(dirname "$VPS_PATH")"
          SSH="ssh -i ~/.ssh/id_deploy -p ${VPS_PORT:-22}"

          # Si Docker creó una carpeta con el nombre del archivo (volumen apuntando a un archivo inexistente), se quita.
          $SSH "$VPS_USER@$VPS_HOST" "[ -d '$APP_DIR/odontogamma-nginx.conf' ] && rmdir '$APP_DIR/odontogamma-nginx.conf'; touch '$APP_DIR/odontogamma-nginx.conf'"

          # --inplace conserva el inodo: un volumen de un solo archivo no ve el reemplazo atómico.
          rsync -az --inplace -e "$SSH" \
            deploy/odontogamma-nginx.conf \
            "$VPS_USER@$VPS_HOST:$APP_DIR/odontogamma-nginx.conf"

          $SSH "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && docker compose up -d --force-recreate odontogamma && sleep 3 && docker ps --filter name=odontogamma_container --filter status=running -q | grep -q ."
