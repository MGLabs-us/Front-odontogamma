name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -m 700 -d ~/.ssh
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload build to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          rsync -rlt  z --delete --omit-dir-times --chmod=D775,F664 \
            -e "sshpass -e ssh -p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            dist/odontoGammaOriente/browser/ \
            "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      # El nginx del contenedor vive en el repo (deploy/odontogamma-nginx.conf). Se escribe en el
      # mismo archivo que monta docker-compose (mismo inodo) y se recrea el contenedor.
      - name: Update container nginx config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          APP_DIR="$(dirname "$VPS_PATH")"
          SSH="sshpass -e ssh -p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no"

          # Si Docker creó una carpeta con el nombre del archivo, se quita; luego se asegura que el archivo exista.
          $SSH "$VPS_USER@$VPS_HOST" "[ -d '$APP_DIR/odontogamma-nginx.conf' ] && rmdir '$APP_DIR/odontogamma-nginx.conf'; touch '$APP_DIR/odontogamma-nginx.conf'"

          # cat > escribe en el mismo archivo (conserva el inodo del volumen de un solo archivo).
          $SSH "$VPS_USER@$VPS_HOST" "cat > '$APP_DIR/odontogamma-nginx.conf'" < deploy/odontogamma-nginx.conf

          $SSH "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && docker compose up -d --force-recreate odontogamma && sleep 3 && docker ps --filter name=odontogamma_container --filter status=running -q | grep -q ."